<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISN Generator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display: block; margin-top: 10px; }
    textarea { width: 100%; height: 220px; margin-top: 10px; }
    button { margin-top: 15px; padding: 8px 14px; }
    select, input[type="text"] { margin-top: 5px; }
  </style>
</head>
<body>

<h1>ISN Generator</h1>

<label>
  Topic:
  <input type="text" id="topic" placeholder="e.g., Cells, Energy, Ecosystems">
</label>

<label>
  Type:
  <select id="typeSelect">
    <option value="acrostic">Acrostic Poem</option>
    <option value="oneword">One-Word Poem</option>
    <option value="pyramid">Pyramid (3 topics)</option>
    <option value="tshirt">T-Shirt Concept</option>
  </select>
</label>

<label>
  Assignment Upload (optional):
  <input type="file" id="assignmentFile">
</label>

<button id="generateBtn">Generate</button>

<h2>Output</h2>
<textarea id="output" readonly></textarea>

<script>
  function randomChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // ---------- ACROSTIC (one word per letter) ----------
  function generateAcrostic(topic) {
    const letters = topic.replace(/\s+/g, '').toUpperCase().split('');
    const wordBank = {
      A: ["Amazing","Active","Adaptive","Atomic"],
      B: ["Bold","Balanced","Bright","Basic"],
      C: ["Creative","Curious","Critical","Core"],
      D: ["Dynamic","Deep","Driven","Direct"],
      E: ["Essential","Endless","Energetic","Exact"],
      F: ["Focused","Fundamental","Fresh","Factual"],
      G: ["Grounded","Growing","Global","Guided"],
      H: ["Helpful","Hidden","Human","Harmonic"],
      I: ["Important","Inner","Infinite","Ideal"],
      J: ["Just","Joyful","Joint","Judicious"],
      K: ["Key","Known","Kinetic","Kind"],
      L: ["Logical","Living","Layered","Luminous"],
      M: ["Meaningful","Major","Modern","Measured"],
      N: ["Natural","Notable","New","Necessary"],
      O: ["Original","Open","Ordered","Optimal"],
      P: ["Powerful","Primary","Pure","Practical"],
      Q: ["Quiet","Quick","Qualified","Questing"],
      R: ["Real","Rooted","Relevant","Radiant"],
      S: ["Strong","Simple","Structured","Scientific"],
      T: ["True","Timeless","Tangible","Thoughtful"],
      U: ["Unified","Unique","Useful","Universal"],
      V: ["Vast","Vital","Vivid","Valuable"],
      W: ["Wise","Whole","Wide","Working"],
      X: ["Xenial","Xyloid","Xenogenic","X-factor"],
      Y: ["Young","Yielding","Yearly","Yonder"],
      Z: ["Zesty","Zealous","Zonal","Zen"]
    };

    let lines = [`ACROSTIC FOR: ${topic}\n`];
    letters.forEach(letter => {
      const options = wordBank[letter] || ["Word"];
      const chosen = randomChoice(options);
      // One word per letter, starting with that letter
      lines.push(`${letter}${chosen.slice(1)}`);
    });
    return lines.join("\n");
  }

  // ---------- ONE-WORD POEM ----------
  function generateOneWordPoem(topic) {
    const words = ["Momentum","Spark","Origin","Pulse","Essence","Catalyst","Shift","Focus","Awakening"];
    return `ONE-WORD POEM FOR: ${topic}\n\n${randomChoice(words)}`;
  }

  // ---------- PYRAMID (3 topics, 1–3-word descriptions, no long text) ----------
  function generatePyramid(topic) {
    // You can customize these sets per topic if you want
    const oneWord = ["Life","Matter","Energy","Balance","Change","Motion"];
    const twoWords = ["Basic Units","Tiny Parts","Moving Energy","Living Systems","Key Idea","Core Concept"];
    const threeWords = ["Made From Cells","Drives Every Process","Supports All Life","Builds All Organisms","Changes Over Time","Connects Every Level"];

    const line1 = `1. ${topic} — ${randomChoice(oneWord)}`;
    const line2 = `2. ${topic} — ${randomChoice(twoWords)}`;
    const line3 = `3. ${topic} — ${randomChoice(threeWords)}`;

    return `PYRAMID FOR: ${topic}\n\n${line1}\n${line2}\n${line3}`;
  }

  // ---------- T-SHIRT CONCEPT ----------
  function generateTShirt(topic) {
    const fronts = [
      `Bold graphic saying "${topic} Mode"`,
      `Minimalist icon with "${topic} Crew"`,
      `Retro text: "${topic} Forever"`,
      `Comic-style burst: "${topic} Power"`
    ];

    const backs = [
      `A simple diagram showing the main idea of ${topic}.`,
      `A symbol representing the core of ${topic}.`,
      `A flowchart explaining how ${topic} works.`,
      `A quote that captures the meaning of ${topic}.`
    ];

    const p1 = `This T-shirt design connects to ${topic} by turning the idea into a visual symbol students can recognize instantly. The front graphic makes the topic feel bold and memorable. It transforms the lesson into something wearable and expressive.`;

    const p2 = `The back design acts like a portable anchor chart for ${topic}. It highlights the most important parts in a simple, visual way. Anyone who asks about the shirt gives the student a chance to review the topic out loud.`;

    return `T-SHIRT CONCEPT FOR: ${topic}\n
Front: ${randomChoice(fronts)}
Back: ${randomChoice(backs)}

Paragraph 1:
${p1}

Paragraph 2:
${p2}`;
  }

  // ---------- MAIN HANDLER ----------
  document.getElementById("generateBtn").addEventListener("click", () => {
    let topic = document.getElementById("topic").value.trim();
    if (!topic) topic = "My Topic";

    const type = document.getElementById("typeSelect").value;
    let output = "";

    if (type === "acrostic") {
      output = generateAcrostic(topic);
    } else if (type === "oneword") {
      output = generateOneWordPoem(topic);
    } else if (type === "pyramid") {
      output = generatePyramid(topic);
    } else if (type === "tshirt") {
      output = generateTShirt(topic);
    }

    document.getElementById("output").value = output;
  });
</script>

</body>
</html>
